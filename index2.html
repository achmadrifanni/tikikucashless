<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tikiku | Cashless Payment Report</title>
    <link rel="stylesheet" href="css/reset.css" />

  <body>
    <header class="header">
      <img src="assets/logo.png" alt="logo tikiku" class="logo" />
      <h2>Cashless Payment Report</h2>
    </header>
    <main>
      <div class="container">
        <div class="card qris">
          <!-- Tambah Transaksi -->
          <section class="card__section">
            <header class="card__header">
              <h3 class="section-title">
                <span class="section-title__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-square-plus"
                  >
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                  </svg>
                </span>
                <span class="section-title__text">Tambah Transaksi</span>
              </h3>
              <strong>QRIS</strong>
            </header>
            <form action="">
              <div class="form__row">
                <div class="form__group">
                  <label for="receiptInput">Nomor Resi</label>
                  <div class="input__group">
                    <span>
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-scan-barcode-icon lucide-scan-barcode"
                      >
                        <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                        <path d="M8 7v10" />
                        <path d="M12 7v10" />
                        <path d="M17 7v10" />
                      </svg>
                    </span>
                    <input
                      type="text"
                      minlength="12"
                      pattern="\d*"
                      inputmode="numeric"
                      id="receiptInput"
                      placeholder="Nomor Resi"
                    />
                  </div>
                </div>
                <div class="form__group">
                  <label for="shippingInput">Ongkir</label>
                  <div class="input__group">
                    <span>Rp</span>
                    <input
                      type="number"
                      id="shippingInput"
                      placeholder="Contoh: 32000"
                    />
                  </div>
                </div>
              </div>
              <button
                type="button"
                id="addBtn"
                class="btn btn__icon btn--wide btn--primary"
                aria-label="Tambah Transaksi"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-plus-icon lucide-plus"
                >
                  <path d="M5 12h14" />
                  <path d="M12 5v14" />
                </svg>
                <span>Tambah</span>
              </button>
            </form>
          </section>

          <!-- Daftar Transaksi -->

                          stroke-width="2"

                          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />

                    <td>1</td>

                    <td>32000</td>
                    <td>
                      <button class="btn btn--danger">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"

                          viewBox="0 0 24 24"
                          fill="none"

                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="lucide lucide-trash"
                        >
                          <path d="M10 11v6" />

                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                          <path d="M3 6h18" />
                          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="total">
              <header class="card__header">
                <h3 class="section-title">
                  <span class="section-title__icon" aria-hidden="true">
                    <svg

                      class="lucide lucide-wallet"

                      <path

                      />
                      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                    </svg>
                  </span>
                  <span class="section-title__text">Total Pembayaran</span>
                </h3>
                <span class="total__amount" id="total"></span>
              </header>
            </div>

        <div class="card pdf">
          <header class="card__header">
            <h3 class="section-title">

                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"

                  stroke-width="2"
