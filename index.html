<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tikiku Cashless Payment</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>TIKIKU</h1>
      <p>Cashless Payment Report</p>

      <div class="card">
        <header class="card__title">
          <span class="card__icon">
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-playlist-add"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M19 8h-14" />
              <path d="M5 12h9" />
              <path d="M11 16h-6" />
              <path d="M15 16h6" />
              <path d="M18 13v6" />
            </svg>
          </span>
          <h4>Tambah Transaksi</h4>
        </header>
        <form>
          <div class="form__row">
            <div class="form__group">
              <label for="receiptInput">Nomor Resi</label>

              <div class="input__group">
                <span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-scan-barcode-icon lucide-scan-barcode"
                  >
                    <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                    <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                    <path d="M8 7v10" />
                    <path d="M12 7v10" />
                    <path d="M17 7v10" /></svg
                ></span>
                <input
                  type="text"
                  minlength="12"
                  pattern="\d*"
                  inputmode="numeric"
                  id="receiptInput"
                  placeholder="Masukkan Nomor Resi"
                />
              </div>
            </div>
            <div class="form__group">
              <label for="shippingInput">Ongkir</label>
              <div class="input__group">
                <span>Rp</span>
                <input
                  type="number"
                  id="shippingInput"
                  placeholder="Contoh: 32000"
                />
              </div>
            </div>

            <button
              type="button"
              id="addBtn"
              class="btn btn__icon btn--primary"
              aria-label="Tambah Transaksi"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-plus-icon lucide-plus"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
              <span>Tambah</span>
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <header class="card__title">
          <div class="card__icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-list"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M9 6l11 0" />
              <path d="M9 12l11 0" />
              <path d="M9 18l11 0" />
              <path d="M5 6l0 .01" />
              <path d="M5 12l0 .01" />
              <path d="M5 18l0 .01" />
            </svg>
          </div>
          <h4>Daftar Transaksi</h4>
        </header>
        <div class="table__wrapper">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Nomor Resi</th>
                <th>Ongkir</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="shipmentTableBody"></tbody>
          </table>
        </div>
        <footer class="card__total">
          <span class="total__label">Total Pembayaran</span>
          <span class="total__value" id="total"></span>
        </footer>
      </div>

      <div class="card">
        <header class="card__title">Upload Pdf Laporan</header>
        <div class="pdf__upload">
          <label for="pdfInput">Upload PDF Laporan</label>
          <input type="file" id="pdfInput" accept="application/pdf" />
          <p id="pdfName">Belum ada file yang dipilih</p>
        </div>
      </div>

      <button type="button" id="mergeButton">CREATE & MERGE PDF</button>
    </div>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
