<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tikiku | Cashless Payment Report</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- TRANSAKSI -->
      <main class="card transaction">

        <!-- TAB -->
        <div class="tab">
          <button class="tab__btn active">QRIS</button>
          <button class="tab__btn">Transfer</button>
          <button class="tab__btn">Debit</button>
        </div>

        <!-- PAYMENT -->
        <div class="payment">

          <!-- QRIS -->
          <div class="payment__content active">
            <!-- Tambah Transaksi -->
            <section>
              <form action="" class="form">
                <div class="form__row">
                  <div class="form__group">
                    <label for="qrisReceiptInput">Nomor Resi</label>
                    <div class="input-group">
                      <span class="input-group__prefix">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="lucide lucide-scan-barcode-icon lucide-scan-barcode"
                        >
                          <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                          <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                          <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                          <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                          <path d="M8 7v10" />
                          <path d="M12 7v10" />
                          <path d="M17 7v10" />
                        </svg>
                      </span>
                      <input
                        type="text"
                        minlength="12"
                        pattern="\d*"
                        inputmode="numeric"
                        id="qrisReceiptInput"
                        placeholder="660xxxxxxxxx"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <div class="form__group">
                    <label for="qrisShippingInput">Ongkir</label>
                    <div class="input-group">
                      <span class="input-group__prefix">Rp</span>
                      <input
                        type="number"
                        id="qrisShippingInput"
                        placeholder="Contoh: 32000"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    id="qrisAddBtn"
                    class="btn btn__icon btn--primary"
                    aria-label="Tambah Transaksi"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-plus-icon lucide-plus"
                    >
                      <path d="M5 12h14" />
                      <path d="M12 5v14" />
                    </svg>
                    <span>Tambah</span>
                  </button>
                </div>
              </form>
            </section>

            <!-- Total Transaksi -->
            <section>
              <header class="payment__info">
                <h3 class="section-title">
                  <span class="section-title__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-wallet"
                    >
                      <path
                        d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
                      />
                      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                    </svg>
                  </span>
                  <span class="section-title__text">
                    Total Pembayaran QRIS
                  </span>
                </h3>
                <span class="payment__total" id="qrisTotal">Rp 0</span>
              </header>
            </section>

            <!-- Tabel Transaksi -->
            <section>
              <table class="table">
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Nomor Resi</th>
                    <th>Ongkir</th>
                    <th>Aksi</th>
                  </tr>
                </thead>

                <tbody id="qrisTableBody"></tbody>
              </table>
            </section>
            
          </div>

          <!-- TRANSFER -->
          <div class="payment__content">
            <!-- Tambah Transaksi -->
            <section>
              <form action="" class="form">
                <div class="form__row">
                  <div class="form__group">
                    <label for="trfReceiptInput">Nomor Resi</label>
                    <div class="input-group">
                      <span class="input-group__prefix">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="lucide lucide-scan-barcode-icon lucide-scan-barcode"
                        >
                          <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                          <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                          <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                          <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                          <path d="M8 7v10" />
                          <path d="M12 7v10" />
                          <path d="M17 7v10" />
                        </svg>
                      </span>
                      <input
                        type="text"
                        minlength="12"
                        pattern="\d*"
                        inputmode="numeric"
                        id="trfReceiptInput"
                        placeholder="660xxxxxxxxx"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <div class="form__group">
                    <label for="trfShippingInput">Ongkir</label>
                    <div class="input-group">
                      <span class="input-group__prefix">Rp</span>
                      <input
                        type="number"
                        id="trfShippingInput"
                        placeholder="Contoh: 32000"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    id="trfAddBtn"
                    class="btn btn__icon btn--primary"
                    aria-label="Tambah Transaksi"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-plus-icon lucide-plus"
                    >
                      <path d="M5 12h14" />
                      <path d="M12 5v14" />
                    </svg>
                    <span>Tambah</span>
                  </button>
                </div>
              </form>
            </section>

            <!-- Total Transaksi -->
            <section>
              <header class="payment__info">
                <h3 class="section-title">
                  <span class="section-title__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-wallet"
                    >
                      <path
                        d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
                      />
                      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                    </svg>
                  </span>
                  <span class="section-title__text"
                    >Total Pembayaran Transfer</span
                  >
                </h3>
                <span class="payment__total" id="trfTotal">Rp 0</span>
              </header>
            </section>
            
            <!-- Tabel Transaksi -->
            <section>
              <table class="table">
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>Nomor Resi</th>
                      <th>Ongkir</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>

                  <tbody id="trfTableBody"></tbody>
                </table>
            </section>
          </div>

          <!-- DEBIT -->
          <div class="payment__content">
            <!-- Tambah Transaksi -->
            <section>
              <form action="" class="form">
                <div class="form__row">
                  <div class="form__group">
                    <label for="debitReceiptInput">Nomor Resi</label>
                    <div class="input-group">
                      <span class="input-group__prefix">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="lucide lucide-scan-barcode-icon lucide-scan-barcode"
                        >
                          <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                          <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                          <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                          <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                          <path d="M8 7v10" />
                          <path d="M12 7v10" />
                          <path d="M17 7v10" />
                        </svg>
                      </span>
                      <input
                        type="text"
                        minlength="12"
                        pattern="\d*"
                        inputmode="numeric"
                        id="debitReceiptInput"
                        placeholder="660xxxxxxxxx"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <div class="form__group">
                    <label for="debitShippingInput">Ongkir</label>
                    <div class="input-group">
                      <span class="input-group__prefix">Rp</span>
                      <input
                        type="number"
                        id="debitShippingInput"
                        placeholder="Contoh: 32000"
                        class="input-group__field"
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    id="debitAddBtn"
                    class="btn btn__icon btn--primary"
                    aria-label="Tambah Transaksi"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-plus-icon lucide-plus"
                    >
                      <path d="M5 12h14" />
                      <path d="M12 5v14" />
                    </svg>
                    <span>Tambah</span>
                  </button>
                </div>
              </form>
            </section>

            <!-- Total Transaksi -->
            <section>
              <header class="payment__info">
                <h3 class="section-title">
                  <span class="section-title__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-wallet"
                    >
                      <path
                        d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
                      />
                      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                    </svg>
                  </span>
                  <span class="section-title__text"
                    >Total Pembayaran Debit</span
                  >
                </h3>
                <span class="payment__total" id="debitTotal">Rp 0</span>
              </header>
            </section>

            <!-- Tabel Transaksi -->
            <section>
              <table class="table">
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>Nomor Resi</th>
                      <th>Ongkir</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>

                  <tbody id="debitTableBody"></tbody>
                </table>
            </section>
          </div>

        </div>
      </main>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <!-- HEADER -->
        <header class="card header">
          <img src="assets/logo.png" alt="logo tikiku" class="logo" />
          <h2>Cashless Payment Report</h2>
        </header>
        <!-- PDF -->
        <div class="card pdf">
          <header class="card__header">
            <h3 class="section-title">
              <span class="section-title__icon" aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-upload"
                >
                  <path d="M12 3v12" />
                  <path d="m17 8-5-5-5 5" />
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                </svg>
              </span>
              <span class="section-title__text">Upload PDF Laporan</span>
            </h3>
          </header>
          <div class="pdf__wrapper">
            <div class="pdf__upload" id="pdfUpload">
              <label for="pdfInput">Upload PDF Laporan</label>
              <input type="file" id="pdfInput" accept="application/pdf" />
              <!-- <p id="pdfName">Belum ada file yang dipilih</p> -->
            </div>
            <button
              type="button"
              class="btn btn__icon btn--wide btn--primary"
              id="mergeButton"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-merge"
              >
                <path d="m8 6 4-4 4 4" />
                <path d="M12 2v10.3a4 4 0 0 1-1.172 2.872L4 22" />
                <path d="m20 22-5-5" />
              </svg>
              <span> CREATE & MERGE PDF </span>
            </button>
          </div>
        </div>
      </aside>
    </div>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
