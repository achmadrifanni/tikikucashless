<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/reset.css" />
    <style>
      .transaction-tabs {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        border-bottom: 1px solid #e5e7eb;
      }

      .transaction-tab {
        flex: 1;
        padding: 12px 16px;

        border: 0;
        background: transparent;

        color: #64748b;
        font-size: 14px;
        font-weight: 700;

        cursor: pointer;

        border-bottom: 3px solid transparent;
      }

      .transaction-tab:hover {
        color: #0b3fb3;
      }

      .transaction-tab.active {
        color: #0b3fb3;
        border-bottom-color: #0b3fb3;
      }
    </style>
  </head>
  <body>
    <section class="transaction-card">
      <header class="transaction-header">
        <div class="section-title">
          <i data-lucide="plus-square"></i>
          <h2>Tambah Transaksi</h2>
        </div>
      </header>

      <!-- TAB -->
      <nav class="transaction-tabs" aria-label="Jenis transaksi">
        <button class="transaction-tab active" type="button" data-tab="qris">
          QRIS
        </button>

        <button class="transaction-tab" type="button" data-tab="transfer">
          TRANSFER
        </button>

        <button class="transaction-tab" type="button" data-tab="debit">
          DEBIT
        </button>
      </nav>

      <!-- CONTENT -->
      <div class="transaction-content">
        <!-- FORM -->
        <form class="transaction-form">
          <div class="form-group">
            <label for="receipt"> Nomor Resi </label>

            <input type="text" id="receipt" placeholder="Nomor Resi" />
          </div>

          <div class="form-group">
            <label for="cost"> Ongkir </label>

            <input type="number" id="cost" placeholder="Contoh: 32000" />
          </div>

          <button type="submit">+ Tambah</button>
        </form>

        <!-- TABLE -->
        <section class="transaction-list">
          <div class="list-title">
            <i data-lucide="list"></i>
            <h3>Daftar Transaksi</h3>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nomor Resi</th>
                  <th>Ongkir</th>
                  <th>Aksi</th>
                </tr>
              </thead>

              <tbody id="transactionTableBody">
                <!-- JavaScript -->
              </tbody>
            </table>
          </div>
        </section>

        <!-- TOTAL -->
        <div class="transaction-total">
          <div>
            <i data-lucide="wallet"></i>
            <span>Total Pembayaran</span>
          </div>

          <strong id="transactionTotal"> Rp 0 </strong>
        </div>
      </div>
    </section>
    <script>
      const transactionTabs = document.querySelectorAll(".transaction-tab");

      let activeTransaction = "qris";

      transactionTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          activeTransaction = tab.dataset.tab;

          transactionTabs.forEach((item) => {
            item.classList.remove("active");
          });

          tab.classList.add("active");

          renderTransaction();
        });
      });
      function renderTransaction() {
        const currentShipments =
          activeTransaction === "qris"
            ? qrisShipments
            : activeTransaction === "transfer"
              ? trfShipments
              : debitShipments;

        renderTable(currentShipments);

        renderTotal(currentShipments);
      }
    </script>
  </body>
</html>
